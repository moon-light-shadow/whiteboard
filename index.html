<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>Whiteboard · 无限画布白板</title>
    <style>
      /* 首屏防白屏：挂载前即为主题底色，避免闪白 */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #f8fafc;
      }
      html.dark body,
      html.dark #root {
        background: #0b1220;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: Inter, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #64748b;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      #boot .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(135deg, #6366f1, #818cf8);
        animation: bootpulse 1s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><span class="dot"></span><span>正在准备白板…</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[package]
name = "whiteboard"
version = "0.1.0"
description = "Whiteboard - 桌面无限画布白板"
authors = ["Whiteboard"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 约定：业务逻辑放 lib，main.rs 仅做入口
name = "whiteboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
